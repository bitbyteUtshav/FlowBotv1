name: FlowBot CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowbot_test
          POSTGRES_USER: flowbot
          POSTGRES_PASSWORD: flowbot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowbot -d flowbot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Backend syntax checks
        run: npm run check
        working-directory: backend
      - name: Backend unit tests
        run: npm test
        working-directory: backend
      - name: Run database migrations against clean PostgreSQL
        run: npm run migrate
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://flowbot:flowbot_test_password@localhost:5432/flowbot_test
          DATABASE_SSL: "false"
      - name: Verify migration runner is idempotent
        run: npm run migrate
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://flowbot:flowbot_test_password@localhost:5432/flowbot_test
          DATABASE_SSL: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service dependencies
        run: pip install -r requirements.txt
        working-directory: ai-service
      - name: Compile AI service
        run: python -m compileall -q app
        working-directory: ai-service
      - name: AI service tests
        run: PYTHONPATH=. pytest -q
        working-directory: ai-service
